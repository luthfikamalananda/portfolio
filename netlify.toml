# Netlify: connect the repo and Netlify reads this file automatically.
[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # TODO: set to your Netlify URL (or custom domain) once you know it.
  NEXT_PUBLIC_SITE_URL = "https://lompi.my.id"

# Long-term caching for hashed build assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
