# Example Nginx site for a VPS. Copy to /etc/nginx/sites-available/portfolio,
# symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: run `sudo certbot --nginx -d example.com -d www.example.com` afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # TODO: your domain

    # Upload the contents of the local `out/` folder here.
    root /var/www/portfolio;
    index index.html;

    # trailingSlash: true → /id/ is served from /id/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed build assets never change — cache them for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
}
